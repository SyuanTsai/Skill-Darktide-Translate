name: Standard v1 Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-contract-windows-powershell:
    name: repository-contract (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Windows PowerShell compatibility
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\tests\validate-windows-powershell.ps1

  canonical-validation:
    name: Darktide Translate Standard v1
    needs:
      - repository-contract-windows-powershell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up approved Go runtime
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          check-latest: true
          cache: false

      - name: Capture resolved stable Go runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $versionOutput = @(& go version)
          if ($LASTEXITCODE -ne 0 -or $versionOutput.Count -ne 1 -or
              [string]$versionOutput[0] -notmatch '^go version go(?<version>[0-9]+\.[0-9]+\.[0-9]+) [^\s]+/[^\s]+$') {
            throw "setup-go did not provide one stable Go runtime version. Evidence='$($versionOutput -join ' | ')'"
          }
          "STANDARD_GO_RUNTIME_VERSION=$($Matches.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run canonical Standard v1 validation
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          $ErrorActionPreference = 'Stop'
          $baseCandidate = if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $env:PULL_REQUEST_BASE_SHA
          }
          elseif ($env:GITHUB_EVENT_NAME -eq 'push' -and
              -not [string]::IsNullOrWhiteSpace($env:PUSH_BEFORE_SHA) -and
              $env:PUSH_BEFORE_SHA -notmatch '^0+$') {
            $env:PUSH_BEFORE_SHA
          }
          else {
            ''
          }
          $candidateHead = ((git rev-parse HEAD 2>$null) | Select-Object -First 1).Trim()
          $baseCommit = ''
          if ($baseCandidate -match '^[0-9a-f]{40}$' -and $candidateHead -match '^[0-9a-f]{40}$') {
            & git merge-base --is-ancestor $baseCandidate $candidateHead 2>$null
            $ancestryExitCode = $LASTEXITCODE
            if ($ancestryExitCode -eq 0 -and $baseCandidate -cne $candidateHead) {
              $baseCommit = $baseCandidate
            }
            else {
              Write-Warning "The event base '$baseCandidate' is not a distinct ancestor of '$candidateHead'; running the validator without a comparison base."
            }
          }
          elseif (-not [string]::IsNullOrWhiteSpace($baseCandidate)) {
            Write-Warning 'The event base is not one full commit SHA; running the validator without a comparison base.'
          }
          $outputPath = Join-Path $env:RUNNER_TEMP 'darktide-translate-conformance-report.json'
          & ./scripts/Validate.ps1 -ArtifactsRoot $env:RUNNER_TEMP -BaseCommit $baseCommit -ExpectedGoRuntimeVersion $env:STANDARD_GO_RUNTIME_VERSION -OutputPath $outputPath

      - name: Validate GitHub CLI Agent Skills publication
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh --version
          gh skill publish --dry-run .

      - name: Upload canonical validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darktide-translate-standard-v1-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/darktide-translate-conformance-report.json
            ${{ runner.temp }}/sgv1-*
          if-no-files-found: warn
          retention-days: 14

  # These jobs preserve the repository's existing required status contexts while
  # keeping the canonical Standard v1 gate as the only validation policy.
  repository-contract:
    name: repository-contract
    if: ${{ always() }}
    needs:
      - canonical-validation
    runs-on: ubuntu-latest
    steps:
      - name: Mirror canonical Standard v1 result
        shell: bash
        run: |
          set -euo pipefail
          result='${{ needs['canonical-validation'].result }}'
          if [[ "$result" != 'success' ]]; then
            echo "Canonical Standard v1 validation result: $result"
            exit 1
          fi
          echo 'Canonical Standard v1 validation passed.'

  skill-validator:
    name: skill-validator
    if: ${{ always() }}
    needs:
      - canonical-validation
    runs-on: ubuntu-latest
    steps:
      - name: Mirror canonical Standard v1 result
        shell: bash
        run: |
          set -euo pipefail
          result='${{ needs['canonical-validation'].result }}'
          if [[ "$result" != 'success' ]]; then
            echo "Canonical Standard v1 validation result: $result"
            exit 1
          fi
          echo 'Canonical Standard v1 validation passed.'

  skill-tools:
    name: skill-tools
    if: ${{ always() }}
    needs:
      - canonical-validation
    runs-on: ubuntu-latest
    steps:
      - name: Mirror canonical Standard v1 result
        shell: bash
        run: |
          set -euo pipefail
          result='${{ needs['canonical-validation'].result }}'
          if [[ "$result" != 'success' ]]; then
            echo "Canonical Standard v1 validation result: $result"
            exit 1
          fi
          echo 'Canonical Standard v1 validation passed.'
