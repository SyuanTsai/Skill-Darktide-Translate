name: Standard v1 Validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-validation:
    name: Darktide Translate Standard v1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up approved Go runtime
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          check-latest: false
          cache: false

      - name: Run canonical Standard v1 validation
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          $ErrorActionPreference = 'Stop'
          $baseCommit = if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $env:PULL_REQUEST_BASE_SHA
          }
          elseif ($env:GITHUB_EVENT_NAME -eq 'push' -and
              -not [string]::IsNullOrWhiteSpace($env:PUSH_BEFORE_SHA) -and
              $env:PUSH_BEFORE_SHA -notmatch '^0+$') {
            $env:PUSH_BEFORE_SHA
          }
          elseif (git rev-parse HEAD^ 2>$null) {
            'HEAD^'
          }
          else {
            ''
          }
          $outputPath = Join-Path $env:RUNNER_TEMP 'darktide-translate-conformance-report.json'
          & ./scripts/Validate.ps1 -ArtifactsRoot $env:RUNNER_TEMP -BaseCommit $baseCommit -OutputPath $outputPath
