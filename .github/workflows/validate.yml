name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Resolve Pester
        shell: pwsh
        run: |
          $module = Get-Module -Name Pester -ListAvailable |
            Where-Object { $_.Version.Major -ge 5 } |
            Sort-Object Version -Descending |
            Select-Object -First 1
          if ($null -eq $module) {
            Install-Module -Name Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck
            $module = Get-Module -Name Pester -ListAvailable |
              Where-Object { $_.Version.Major -ge 5 } |
              Sort-Object Version -Descending |
              Select-Object -First 1
          }
          Write-Host "Pester $($module.Version)"

      - name: Run the same clean-HEAD gate required before push
        shell: pwsh
        run: ./scripts/Invoke-PrePushValidation.ps1
