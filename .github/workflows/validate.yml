name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Resolve Pester
        shell: pwsh
        run: |
          $module = Get-Module -Name Pester -ListAvailable |
            Where-Object { $_.Version.Major -ge 5 } |
            Sort-Object Version -Descending |
            Select-Object -First 1
          if ($null -eq $module) {
            Install-Module -Name Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck
            $module = Get-Module -Name Pester -ListAvailable |
              Where-Object { $_.Version.Major -ge 5 } |
              Sort-Object Version -Descending |
              Select-Object -First 1
          }
          Write-Host "Pester $($module.Version)"

      - name: Run repository and Skill contract tests
        shell: pwsh
        run: ./tests/Invoke-Tests.ps1

      - name: Validate packaged Schema 14 and Schema 15 references
        shell: pwsh
        run: ./.agents/skills/auto-update-darktide-mod/scripts/Test-ReferenceIntegrity.ps1

      - name: Validate reproducible source pin
        shell: pwsh
        run: |
          $pin = ./scripts/Get-SourcePin.ps1 -Ref HEAD | ConvertFrom-Json
          if ($pin.sourceId -ne 'darktide-translate') { throw 'Unexpected sourceId.' }
          if ($pin.resolvedCommit -notmatch '^[0-9a-f]{40}$') { throw 'Invalid resolved commit.' }
          if ($pin.contentSha256 -notmatch '^[0-9a-f]{64}$') { throw 'Invalid content SHA-256.' }
          if ($pin.resolvedVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid repository version.' }
          Write-Host "Validated pin for $($pin.resolvedCommit) with content SHA-256 $($pin.contentSha256)."
