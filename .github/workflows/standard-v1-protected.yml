name: Darktide Translate Windows Main Validation

# PR validation runs in standard-v1-candidate-windows.yml with a read-only
# token. This main-only workflow validates the merged commit; it does not
# publish legacy head-bound checks or execute the retired Linux/PS5.1 jobs.

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-main:
    name: Darktide Translate Windows Main
    runs-on: windows-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout immutable main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up approved Go runtime
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          check-latest: true
          cache: false

      - name: Set up Node for central npm lock resolution
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          check-latest: true

      - name: Require npm 11 lockfile semantics
        shell: pwsh
        run: |
          $npmVersion = ([string](& npm --version)).Trim()
          if ($LASTEXITCODE -ne 0 -or $npmVersion -notmatch '^11\.[0-9]+\.[0-9]+$') {
            throw "The central resolver requires npm 11 lockfile semantics; found '$npmVersion'."
          }

      - name: Validate main commit with PowerShell 7
        shell: pwsh
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.before }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -lt 7 -or -not $IsWindows) {
            throw 'Main validation requires Windows with PowerShell 7.'
          }
          $runnerNpmPrefix = [Environment]::GetEnvironmentVariable('NPM_CONFIG_PREFIX', 'Process')
          if ($runnerNpmPrefix -ceq 'C:\npm\prefix') {
            [Environment]::SetEnvironmentVariable('NPM_CONFIG_PREFIX', $null, 'Process')
          }
          elseif (-not [string]::IsNullOrWhiteSpace($runnerNpmPrefix)) {
            throw 'Unexpected npm prefix in the main runner environment.'
          }
          $repositoryRoot = [IO.Path]::GetFullPath((Get-Location).Path)
          $gitPath = (Get-Command git -CommandType Application -ErrorAction Stop | Select-Object -First 1).Path
          $gitArguments = @('-c', "safe.directory=$repositoryRoot", '-C', $repositoryRoot)
          $checkoutHead = ([string]((& $gitPath @gitArguments rev-parse HEAD) | Select-Object -First 1)).Trim()
          if ($LASTEXITCODE -ne 0 -or $checkoutHead -cnotmatch '^[0-9a-f]{40}$' -or
              $checkoutHead -cne $env:EXPECTED_HEAD_SHA) {
            throw 'Checked-out main commit does not match the push SHA.'
          }
          $baseCommit = ''
          if ([string]$env:BASE_SHA -cmatch '^[0-9a-f]{40}$') {
            $mergeBase = ([string]((& $gitPath @gitArguments merge-base $env:BASE_SHA $checkoutHead) | Select-Object -First 1)).Trim()
            if ($LASTEXITCODE -eq 0 -and $mergeBase -cmatch '^[0-9a-f]{40}$' -and
                $mergeBase -cne $checkoutHead) {
              $baseCommit = $mergeBase
            }
          }
          if ([string]::IsNullOrWhiteSpace($baseCommit)) {
            throw 'Main push did not resolve a distinct base commit.'
          }
          $goVersion = @(& go version)
          if ($LASTEXITCODE -ne 0 -or $goVersion.Count -ne 1) {
            throw 'The approved stable Go runtime could not be identified.'
          }
          $goRuntimeMatch = [regex]::Match([string]$goVersion[0],
              '^go version go(?<version>[0-9]+\.[0-9]+\.[0-9]+) [^\s]+/[^\s]+$')
          if (-not $goRuntimeMatch.Success) {
            throw 'The approved stable Go runtime could not be identified.'
          }
          $expectedGoRuntimeVersion = $goRuntimeMatch.Groups['version'].Value
          $reportPath = Join-Path $env:RUNNER_TEMP 'darktide-windows-main-report.json'
          & pwsh -NoProfile -NonInteractive -File (Join-Path $repositoryRoot 'scripts/Validate.ps1') `
              -RepositoryRoot $repositoryRoot -ArtifactsRoot $env:RUNNER_TEMP `
              -BaseCommit $baseCommit -TrustedTestCommit $checkoutHead `
              -ExpectedGoRuntimeVersion $expectedGoRuntimeVersion -OutputPath $reportPath
          if ($LASTEXITCODE -ne 0) { throw "Main validator exited $LASTEXITCODE." }
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
            throw 'Main validator did not produce a report.'
          }
          $report = Get-Content -LiteralPath $reportPath -Raw -Encoding utf8 | ConvertFrom-Json -Depth 100
          if ([string]$report.candidate.commit -cne $checkoutHead -or
              [string]$report.stages.repositoryTests.pester.trustedCommit -cne $checkoutHead -or
              [string]$report.result -cne 'passed' -or
              [string]$report.executionBoundary.platform -cne 'windows-restricted-primary-token-job-object') {
            throw 'Main report does not prove a successful exact-commit Windows validation.'
          }
          Write-Host "Validated immutable main commit $checkoutHead."
