# This base-owned workflow evaluates candidate Git data with the transition
# validator from the immutable event base. It does not execute candidate code
# and it never represents complete Standard v1 or release eligibility.
name: Protected Validation Rebuild Policy

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  validation-rebuild-policy:
    name: validation-rebuild-policy
    runs-on: windows-latest
    steps:
      - name: Checkout immutable trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout immutable candidate as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Evaluate transition identity and release block
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          PRODUCT_BASELINE_SHA: 67fdb8c714468b59f5efd8cf4e74abdb4039d765
        run: |
          if ($env:CANDIDATE_SHA -cnotmatch '^[0-9a-f]{40}$') {
            throw 'The pull request head did not resolve to one full candidate SHA.'
          }
          & ./trusted/scripts/Test-ValidationTransition.ps1 `
            -RepositoryRoot ./candidate `
            -CandidateCommit $env:CANDIDATE_SHA `
            -ProductBaselineCommit $env:PRODUCT_BASELINE_SHA
