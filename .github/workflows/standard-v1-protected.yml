name: Darktide Translate Standard v1 Protected Validation
# This workflow is base-owned for pull_request_target. Candidate files are
# checked out only as data; trusted supervisor files are materialized from
# github.sha, the event-bound base commit.

on:
  push:
    branches:
      - main
  pull_request_target:

permissions:
  contents: read
  checks: write

jobs:
  repository-contract-windows-powershell:
    name: repository-contract (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize protected Windows compatibility contract
        shell: powershell
        env:
          TRUSTED_SUPERVISOR_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $trustedCommit = [string]$env:TRUSTED_SUPERVISOR_COMMIT
          if ($trustedCommit -notmatch '^[0-9a-f]{40}$') {
            throw 'The protected supervisor commit must be one lowercase full Git SHA.'
          }
          $trustedRoot = Join-Path $env:RUNNER_TEMP 'standard-v1-trusted-windows-contract'
          if (Test-Path -LiteralPath $trustedRoot) {
            throw "The protected Windows contract root already exists: $trustedRoot"
          }
          [void](New-Item -ItemType Directory -Path $trustedRoot -Force)
          $gitCommand = Get-Command git -CommandType Application -ErrorAction Stop | Select-Object -First 1
          $gitPath = [IO.Path]::GetFullPath([string]$gitCommand.Path)
          $relativePath = 'tests/validate-windows-powershell.ps1'
          $revision = "${trustedCommit}:$relativePath"
          $actualBlob = ((& $gitPath rev-parse $revision 2>$null) | Select-Object -First 1).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualBlob -notmatch '^[0-9a-f]{40}$') {
            throw 'The protected Windows contract is missing from the event-bound supervisor commit.'
          }
          $destination = Join-Path $trustedRoot (Split-Path -Leaf $relativePath)
          $process = [Diagnostics.Process]::new()
          $process.StartInfo.FileName = $gitPath
          $process.StartInfo.Arguments = "cat-file blob $revision"
          $process.StartInfo.UseShellExecute = $false
          $process.StartInfo.RedirectStandardOutput = $true
          $process.StartInfo.RedirectStandardError = $true
          if (-not $process.Start()) { throw 'Could not start Git to materialize the protected Windows contract.' }
          $stream = [IO.File]::Open($destination, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::Read)
          try { $process.StandardOutput.BaseStream.CopyTo($stream) }
          finally { $stream.Dispose() }
          $stderr = $process.StandardError.ReadToEnd()
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) { throw "Git could not materialize the protected Windows contract: $stderr" }
          $item = Get-Item -LiteralPath $destination -Force
          if ($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
            throw 'Protected Windows contract must be a regular non-reparse file.'
          }
          $rootItem = Get-Item -LiteralPath $trustedRoot -Force
          if (-not $rootItem.PSIsContainer -or ($rootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
            throw 'Protected Windows contract root must be a regular non-reparse directory.'
          }
          "TRUSTED_WINDOWS_CONTRACT=$destination" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate Windows PowerShell compatibility
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $windowsPowerShellPath = [IO.Path]::GetFullPath((Join-Path $PSHOME 'powershell.exe'))
          $windowsPowerShellItem = Get-Item -LiteralPath $windowsPowerShellPath -Force -ErrorAction Stop
          if ($windowsPowerShellItem.PSIsContainer -or
              ($windowsPowerShellItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
            throw 'The protected Windows PowerShell executable must be a regular non-reparse file.'
          }
          $protectedContractArguments = @(
            '-NoLogo',
            '-NoProfile',
            '-NonInteractive',
            '-ExecutionPolicy', 'Bypass',
            '-File', $env:TRUSTED_WINDOWS_CONTRACT,
            '-RepositoryRoot', (Get-Location).Path
          )
          & $windowsPowerShellPath @protectedContractArguments
          $protectedContractExitCode = $LASTEXITCODE
          if ($protectedContractExitCode -ne 0) {
            throw 'The protected Windows PowerShell compatibility contract failed.'
          }

      - name: Parse candidate PowerShell trust-anchor files
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $gitCommand = Get-Command git -CommandType Application -ErrorAction Stop | Select-Object -First 1
          $gitPath = [IO.Path]::GetFullPath([string]$gitCommand.Path)
          $trackedPsOutput = [string]((& $gitPath ls-files -z -- '*.ps1' '*.psm1') -join '')
          if ($LASTEXITCODE -ne 0) { throw 'Git failed while enumerating candidate PowerShell trust-anchor files.' }
          $trackedPsFiles = @($trackedPsOutput.Split([char]0) | Where-Object { -not [string]::IsNullOrEmpty([string]$_) })
          foreach ($relativePath in $trackedPsFiles) {
            if ([IO.Path]::IsPathRooted([string]$relativePath) -or
                [string]$relativePath -cmatch '(^|/)\.{1,2}(/|$)' -or
                [string]$relativePath -cmatch '[\x00\r\n]' -or
                ([string]$relativePath).Contains('\')) {
              throw "Candidate PowerShell path is unsafe: $relativePath"
            }
            $candidatePath = Join-Path (Get-Location).Path ([string]$relativePath)
            if (-not (Test-Path -LiteralPath $candidatePath -PathType Leaf)) {
              throw "Candidate PowerShell trust-anchor file is missing: $relativePath"
            }
            $candidateItem = Get-Item -LiteralPath $candidatePath -Force
            if (($candidateItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw "Candidate PowerShell trust-anchor file is a reparse point: $relativePath"
            }
            $tokens = $null
            $errors = $null
            $candidateSource = [IO.File]::ReadAllText(
              $candidatePath,
              [Text.UTF8Encoding]::new($false, $true)
            )
            [Management.Automation.Language.Parser]::ParseInput(
              $candidateSource,
              $candidatePath,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if (@($errors).Count -gt 0) {
              throw "Candidate PowerShell file does not parse under Windows PowerShell 5.1: $relativePath"
            }
          }
          foreach ($requiredPath in @('scripts/Validate.ps1', 'scripts/Test-Repository.ps1')) {
            if ($trackedPsFiles -cnotcontains $requiredPath) {
              throw "Candidate trust-anchor file is not tracked: $requiredPath"
            }
          }



  canonical-validation:
    name: Darktide Translate Standard v1
    needs:
      - repository-contract-windows-powershell
    outputs:
      evidence_base64: ${{ steps.export-evidence.outputs.evidence_base64 }}
      evidence_sha256: ${{ steps.export-evidence.outputs.evidence_sha256 }}
      diagnostics_base64: ${{ steps.export-diagnostics.outputs.diagnostics_base64 }}
      diagnostics_sha256: ${{ steps.export-diagnostics.outputs.diagnostics_sha256 }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize protected validation supervisor
        shell: pwsh
        env:
          TRUSTED_SUPERVISOR_COMMIT: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $trustedCommit = [string]$env:TRUSTED_SUPERVISOR_COMMIT
          if ($trustedCommit -notmatch '^[0-9a-f]{40}$') {
            throw 'The protected supervisor commit must be one lowercase full Git SHA.'
          }
          $trustedRoot = Join-Path $env:RUNNER_TEMP 'standard-v1-trusted-supervisor'
          if (Test-Path -LiteralPath $trustedRoot) {
            throw "The protected supervisor root already exists: $trustedRoot"
          }
          $trustedScriptsRoot = Join-Path $trustedRoot 'scripts'
          [void](New-Item -ItemType Directory -Path $trustedScriptsRoot -Force)
          $gitCommand = Get-Command git -CommandType Application -ErrorAction Stop | Select-Object -First 1
          $gitPath = [IO.Path]::GetFullPath([string]$gitCommand.Path)
          $files = @(
            [pscustomobject]@{ RelativePath = 'scripts/Validate.ps1' },
            [pscustomobject]@{ RelativePath = 'scripts/Test-Repository.ps1' }
          )
          foreach ($file in $files) {
            $revision = "${trustedCommit}:$($file.RelativePath)"
            $actualBlob = ((& $gitPath rev-parse $revision 2>$null) | Select-Object -First 1).Trim()
            if ($LASTEXITCODE -ne 0 -or $actualBlob -notmatch '^[0-9a-f]{40}$') {
              throw "The protected supervisor file '$($file.RelativePath)' is missing from the event-bound supervisor commit."
            }
            $destination = Join-Path $trustedRoot $file.RelativePath
            $process = [Diagnostics.Process]::new()
            $process.StartInfo.FileName = $gitPath
            $process.StartInfo.UseShellExecute = $false
            $process.StartInfo.RedirectStandardOutput = $true
            $process.StartInfo.RedirectStandardError = $true
            [void]$process.StartInfo.ArgumentList.Add('cat-file')
            [void]$process.StartInfo.ArgumentList.Add('blob')
            [void]$process.StartInfo.ArgumentList.Add($revision)
            if (-not $process.Start()) { throw "Could not start Git to materialize '$($file.RelativePath)'." }
            $stream = [IO.File]::Open($destination, [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::Read)
            try { $process.StandardOutput.BaseStream.CopyTo($stream) }
            finally { $stream.Dispose() }
            $stderr = $process.StandardError.ReadToEnd()
            $process.WaitForExit()
            if ($process.ExitCode -ne 0) {
              throw "Git could not materialize the protected supervisor '$($file.RelativePath)': $stderr"
            }
            $item = Get-Item -LiteralPath $destination -Force
            if ($item.PSIsContainer -or ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw "Protected supervisor file '$($file.RelativePath)' is a reparse point."
            }
          }
          $rootItem = Get-Item -LiteralPath $trustedRoot -Force
          if (-not $rootItem.PSIsContainer -or ($rootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
            throw 'Protected supervisor root must be a regular non-reparse directory.'
          }
          "TRUSTED_SUPERVISOR_ROOT=$trustedRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up approved Go runtime
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          check-latest: true
          cache: false

      - name: Capture resolved stable Go runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $versionOutput = @(& go version)
          if ($LASTEXITCODE -ne 0 -or $versionOutput.Count -ne 1 -or
              [string]$versionOutput[0] -notmatch '^go version go(?<version>[0-9]+\.[0-9]+\.[0-9]+) [^\s]+/[^\s]+$') {
            throw "setup-go did not provide one stable Go runtime version. Evidence='$($versionOutput -join ' | ')'"
          }
          "STANDARD_GO_RUNTIME_VERSION=$($Matches.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Delegate Linux cgroup v2 subtree for protected Pester
        shell: bash
        run: |
          set -euo pipefail
          cgroup_parent="/sys/fs/cgroup/codex-validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ ! "$cgroup_parent" =~ ^/sys/fs/cgroup/codex-validation-[0-9]+-[0-9]+$ ]]; then
            echo 'The protected Pester cgroup path did not match the expected run-bound format.' >&2
            exit 1
          fi
          controllers_path='/sys/fs/cgroup/cgroup.controllers'
          if [[ ! -r "$controllers_path" ]]; then
            echo 'The runner does not expose a readable cgroup v2 controller list.' >&2
            exit 1
          fi
          controllers="$(< "$controllers_path")"
          if [[ ! " $controllers " =~ [[:space:]]memory[[:space:]] ]]; then
            echo 'The runner cgroup v2 hierarchy does not expose the memory controller.' >&2
            exit 1
          fi
          if [[ ! " $controllers " =~ [[:space:]]cpu[[:space:]] ]]; then
            echo 'The runner cgroup v2 hierarchy does not expose the CPU controller.' >&2
            exit 1
          fi
          root_subtree_control='/sys/fs/cgroup/cgroup.subtree_control'
          if [[ ! -e "$root_subtree_control" ]]; then
            echo 'The runner cgroup v2 hierarchy does not expose a root subtree control file.' >&2
            exit 1
          fi
          root_controllers_to_enable='+cpu +memory'
          if [[ " $controllers " =~ [[:space:]]pids[[:space:]] ]]; then
            root_controllers_to_enable+=' +pids'
          fi
          printf '%s\n' "$root_controllers_to_enable" | sudo -n tee "$root_subtree_control" >/dev/null
          if [[ -e "$cgroup_parent" ]]; then
            echo "The delegated cgroup path already exists: $cgroup_parent" >&2
            exit 1
          fi
          cgroup_supervisor="$cgroup_parent/trusted-validator"
          cleanup_on_error() {
            sudo -n rmdir -- "$cgroup_supervisor" 2>/dev/null || true
            sudo -n rmdir -- "$cgroup_parent" 2>/dev/null || true
          }
          trap cleanup_on_error ERR
          sudo -n mkdir -- "$cgroup_parent"
          sudo -n chown "$(id -u):$(id -g)" -- "$cgroup_parent"
          sudo -n chmod 0755 -- "$cgroup_parent"
          controllers_to_enable='+cpu +memory'
          if [[ " $controllers " =~ [[:space:]]pids[[:space:]] ]]; then
            controllers_to_enable+=' +pids'
          fi
          printf '%s\n' "$controllers_to_enable" | sudo -n tee "$cgroup_parent/cgroup.subtree_control" >/dev/null
          for delegation_file in \
            "$cgroup_parent/cgroup.procs" \
            "$cgroup_parent/cgroup.threads" \
            "$cgroup_parent/cgroup.subtree_control"; do
            sudo -n chown "$(id -u):$(id -g)" -- "$delegation_file"
          done
          delegated_controls="$(< "$cgroup_parent/cgroup.subtree_control")"
          if [[ ! " $delegated_controls " =~ [[:space:]]memory[[:space:]] || ! " $delegated_controls " =~ [[:space:]]cpu[[:space:]] ]]; then
            echo 'The delegated cgroup root did not enable the memory and CPU controllers.' >&2
            exit 1
          fi
          if [[ ! -w "$cgroup_parent" ]]; then
            echo 'The delegated cgroup root is not writable by the validation runner.' >&2
            exit 1
          fi
          mkdir -- "$cgroup_supervisor"
          if [[ ! -w "$cgroup_supervisor" ]]; then
            echo 'The trusted validator cgroup is not writable by the validation runner.' >&2
            exit 1
          fi
          printf 'CODEX_PESTER_CGROUP_ROOT=%s\nCODEX_PESTER_VALIDATOR_CGROUP=%s\n' \
            "$cgroup_parent" "$cgroup_supervisor" >> "$GITHUB_ENV"
          trap - ERR

      - name: Run canonical Standard v1 validation
        id: canonical-validation
        shell: pwsh
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          $ErrorActionPreference = 'Stop'
          $validatorCgroup = [string]$env:CODEX_PESTER_VALIDATOR_CGROUP
          if ($validatorCgroup -notmatch '^/sys/fs/cgroup/codex-validation-[0-9]+-[0-9]+/trusted-validator$') {
            throw 'The trusted canonical validator cgroup path is missing or invalid.'
          }
          $validatorPid = [string]$PID
          $validatorPid | & sudo -n tee -- (Join-Path $validatorCgroup 'cgroup.procs') | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not place the trusted canonical validator inside its delegated cgroup.' }
          $relativeValidatorCgroup = $validatorCgroup.Substring('/sys/fs/cgroup'.Length)
          $currentCgroup = [IO.File]::ReadAllText("/proc/$PID/cgroup").Trim()
          if ($currentCgroup -notmatch ("0::" + [regex]::Escape($relativeValidatorCgroup) + '$')) {
            throw 'The trusted canonical validator did not enter its delegated cgroup.'
          }
          $baseCandidate = if ($env:GITHUB_EVENT_NAME -eq 'pull_request_target') {
            $env:PULL_REQUEST_BASE_SHA
          }
          elseif ($env:GITHUB_EVENT_NAME -eq 'push' -and
              -not [string]::IsNullOrWhiteSpace($env:PUSH_BEFORE_SHA) -and
              $env:PUSH_BEFORE_SHA -notmatch '^0+$') {
            $env:PUSH_BEFORE_SHA
          }
          else {
            ''
          }
          $candidateHead = ((git rev-parse HEAD 2>$null) | Select-Object -First 1).Trim()
          $baseCommit = ''
          if ($baseCandidate -match '^[0-9a-f]{40}$' -and $candidateHead -match '^[0-9a-f]{40}$') {
            & git merge-base --is-ancestor $baseCandidate $candidateHead 2>$null
            $ancestryExitCode = $LASTEXITCODE
            if ($ancestryExitCode -eq 0 -and $baseCandidate -cne $candidateHead) {
              $baseCommit = $baseCandidate
            }
            else {
              Write-Warning "The event base '$baseCandidate' is not a distinct ancestor of '$candidateHead'; running the validator without a comparison base."
            }
          }
          elseif (-not [string]::IsNullOrWhiteSpace($baseCandidate)) {
            Write-Warning 'The event base is not one full commit SHA; running the validator without a comparison base.'
          }
          $outputPath = Join-Path $env:RUNNER_TEMP 'darktide-translate-conformance-report.json'
          $trustedValidator = Join-Path $env:TRUSTED_SUPERVISOR_ROOT 'scripts/Validate.ps1'
          $validatorArguments = @(
            '-RepositoryRoot', (Get-Location).Path,
            '-ArtifactsRoot', $env:RUNNER_TEMP,
            '-BaseCommit', $baseCommit,
            '-ExpectedGoRuntimeVersion', $env:STANDARD_GO_RUNTIME_VERSION,
            '-OutputPath', $outputPath
          )
          $isBootstrapTransition =
            (Test-Path -LiteralPath (Join-Path (Get-Location).Path 'catalog/skills-catalog.json') -PathType Leaf) -and
            (-not (Test-Path -LiteralPath (Join-Path (Get-Location).Path 'catalog/source.json') -PathType Leaf)) -and
            (-not (Test-Path -LiteralPath (Join-Path (Get-Location).Path 'config/standard-v1.json') -PathType Leaf))
          if ($isBootstrapTransition) {
            # The trusted validator rechecks the exact current-layout fixture and
            # refuses a mixed or post-migration tree before producing evidence.
            $validatorArguments += '-BootstrapTransition'
          }
          & $trustedValidator @validatorArguments

      - name: Remove delegated Linux cgroup subtree
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          cgroup_parent="${CODEX_PESTER_CGROUP_ROOT:-}"
          if [[ -z "$cgroup_parent" ]]; then
            exit 0
          fi
          if [[ ! "$cgroup_parent" =~ ^/sys/fs/cgroup/codex-validation-[0-9]+-[0-9]+$ ]]; then
            echo 'The cleanup cgroup path did not match the expected run-bound format.' >&2
            exit 1
          fi
          if [[ -e "$cgroup_parent" ]]; then
            cgroup_supervisor="${CODEX_PESTER_VALIDATOR_CGROUP:-$cgroup_parent/trusted-validator}"
            if [[ ! "$cgroup_supervisor" =~ ^/sys/fs/cgroup/codex-validation-[0-9]+-[0-9]+/trusted-validator$ ]]; then
              echo 'The cleanup validator cgroup path did not match the expected run-bound format.' >&2
              exit 1
            fi
            if [[ -e "$cgroup_supervisor" ]]; then
              sudo -n rmdir -- "$cgroup_supervisor"
            fi
            sudo -n rmdir -- "$cgroup_parent"
          fi

      - name: Verify canonical validation evidence
        if: ${{ success() }}
        shell: pwsh
        env:
          EXPECTED_EVIDENCE_SHA256: ${{ steps.canonical-validation.outputs.standard_v1_evidence_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXPECTED_EVIDENCE_SHA256 -notmatch '^[0-9a-f]{64}$') {
            throw 'Canonical validation did not emit one lowercase evidence SHA-256 output.'
          }
          $evidencePath = Join-Path $env:RUNNER_TEMP 'darktide-translate-conformance-report.json'
          if (-not (Test-Path -LiteralPath $evidencePath -PathType Leaf)) {
            throw "Canonical validation evidence is missing: $evidencePath"
          }
          $actualEvidenceSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $evidencePath).Hash.ToLowerInvariant()
          if ($actualEvidenceSha256 -cne $env:EXPECTED_EVIDENCE_SHA256) {
            throw 'Canonical validation evidence changed after the validator returned.'
          }

      - name: Export canonical evidence for clean upload
        id: export-evidence
        if: ${{ success() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidencePath = Join-Path $env:RUNNER_TEMP 'darktide-translate-conformance-report.json'
          $evidenceItem = Get-Item -LiteralPath $evidencePath -Force -ErrorAction Stop
          if ($evidenceItem.PSIsContainer -or ($evidenceItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
            throw 'Canonical evidence must be a regular non-reparse file before export.'
          }
          if ($evidenceItem.Length -gt 524288) { throw 'Canonical evidence exceeds the 512 KiB export limit.' }
          $evidenceBytes = [IO.File]::ReadAllBytes($evidencePath)
          $evidenceBase64 = [Convert]::ToBase64String($evidenceBytes)
          if ($evidenceBase64.Length -gt 800000) { throw 'Canonical evidence exceeds the GitHub output transport limit.' }
          $evidenceSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $evidencePath).Hash.ToLowerInvariant()
          $githubOutputPath = [Environment]::GetEnvironmentVariable('GITHUB_OUTPUT', [EnvironmentVariableTarget]::Process)
          [IO.File]::AppendAllText($githubOutputPath, "evidence_base64=$evidenceBase64$([Environment]::NewLine)evidence_sha256=$evidenceSha256$([Environment]::NewLine)", [Text.UTF8Encoding]::new($false))

      - name: Export bounded validation diagnostics for clean upload
        id: export-diagnostics
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outputPath = [Environment]::GetEnvironmentVariable('GITHUB_OUTPUT', [EnvironmentVariableTarget]::Process)
          $summaryPaths = @(Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Directory -Filter 'sgv1-*' -Force -ErrorAction SilentlyContinue |
            ForEach-Object { Join-Path $_.FullName 'security-preflight-summary.json' } |
            Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })
          if ($summaryPaths.Count -eq 0) {
            [IO.File]::AppendAllText($outputPath, "diagnostics_base64=$([Environment]::NewLine)diagnostics_sha256=$([Environment]::NewLine)", [Text.UTF8Encoding]::new($false))
            exit 0
          }
          if ($summaryPaths.Count -ne 1) { throw 'Expected exactly one bounded validation diagnostics summary.' }
          $summaryPath = [IO.Path]::GetFullPath([string]$summaryPaths[0])
          $summaryItem = Get-Item -LiteralPath $summaryPath -Force
          if ($summaryItem.PSIsContainer -or ($summaryItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
            throw 'Validation diagnostics must be a regular non-reparse file before export.'
          }
          if ($summaryItem.Length -gt 524288) { throw 'Validation diagnostics exceed the 512 KiB export limit.' }
          $bytes = [IO.File]::ReadAllBytes($summaryPath)
          $base64 = [Convert]::ToBase64String($bytes)
          if ($base64.Length -gt 800000) { throw 'Validation diagnostics exceed the GitHub output transport limit.' }
          $sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $summaryPath).Hash.ToLowerInvariant()
          [IO.File]::AppendAllText($outputPath, "diagnostics_base64=$base64$([Environment]::NewLine)diagnostics_sha256=$sha256$([Environment]::NewLine)", [Text.UTF8Encoding]::new($false))

  upload-canonical-validation-evidence:
    name: upload canonical validation evidence
    if: ${{ needs['canonical-validation'].result == 'success' && needs['canonical-validation'].outputs.evidence_base64 != '' }}
    needs:
      - canonical-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Materialize trusted canonical evidence
        shell: bash
        env:
          EVIDENCE_BASE64: ${{ needs['canonical-validation'].outputs.evidence_base64 }}
          EXPECTED_SHA256: ${{ needs['canonical-validation'].outputs.evidence_sha256 }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'Canonical evidence SHA-256 output is invalid.' >&2
            exit 1
          fi
          if (( ${#EVIDENCE_BASE64} > 800000 )); then
            echo 'Canonical evidence exceeds the clean-job transport limit.' >&2
            exit 1
          fi
          printf '%s' "$EVIDENCE_BASE64" | base64 --decode > canonical-validation-evidence.json
          actual_sha256="$(sha256sum canonical-validation-evidence.json | cut -d' ' -f1)"
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo 'Canonical evidence failed clean-job hash verification.' >&2
            exit 1
          fi
          test -s canonical-validation-evidence.json

      - name: Upload canonical validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darktide-translate-standard-v1-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: canonical-validation-evidence.json
          if-no-files-found: error
          retention-days: 14

  upload-validation-diagnostics:
    name: upload bounded validation diagnostics
    if: ${{ always() && needs['canonical-validation'].result == 'failure' && needs['canonical-validation'].outputs.diagnostics_base64 != '' }}
    needs:
      - canonical-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Materialize bounded validation diagnostics
        shell: bash
        env:
          DIAGNOSTICS_BASE64: ${{ needs['canonical-validation'].outputs.diagnostics_base64 }}
          EXPECTED_SHA256: ${{ needs['canonical-validation'].outputs.diagnostics_sha256 }}
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'Validation diagnostics SHA-256 output is invalid.' >&2
            exit 1
          fi
          if (( ${#DIAGNOSTICS_BASE64} > 800000 )); then
            echo 'Validation diagnostics exceed the clean-job transport limit.' >&2
            exit 1
          fi
          printf '%s' "$DIAGNOSTICS_BASE64" | base64 --decode > security-preflight-summary.json
          actual_sha256="$(sha256sum security-preflight-summary.json | cut -d' ' -f1)"
          if [[ "$actual_sha256" != "$EXPECTED_SHA256" ]]; then
            echo 'Validation diagnostics failed clean-job hash verification.' >&2
            exit 1
          fi
          test -s security-preflight-summary.json

      - name: Upload bounded validation diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darktide-translate-standard-v1-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: security-preflight-summary.json
          if-no-files-found: error
          retention-days: 14

  # Candidate validation runs in a contained process boundary. Keep the
  # token-bearing publisher in a clean job whose only candidate interaction is
  # trusted GitHub CLI data parsing after checkout; no candidate process runs in
  # this job before GH_TOKEN is available.
  github-copilot-agent-skills:
    name: GitHub Copilot Agent Skills
    if: ${{ always() && needs['repository-contract-windows-powershell'].result == 'success' && needs['canonical-validation'].result == 'success' }}
    needs:
      - repository-contract-windows-powershell
      - canonical-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout immutable candidate data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate GitHub CLI Agent Skills publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh --version
          gh skill publish --dry-run .

  # GitHub attaches pull_request_target workflow jobs to the base commit. Publish
  # the exact required contexts explicitly against the immutable PR head instead
  # of relying on base-bound mirror jobs or candidate-controlled workflows.
  repository-contract:
    name: repository-contract
    if: ${{ always() }}
    needs:
      - canonical-validation
    runs-on: ubuntu-latest
    steps:
      - name: Deprecated base-bound context
        run: echo 'This base-bound compatibility context is intentionally retained only for bootstrap transition.'

  skill-validator:
    name: skill-validator
    if: ${{ always() }}
    needs:
      - canonical-validation
    runs-on: ubuntu-latest
    steps:
      - name: Deprecated base-bound context
        run: echo 'This base-bound compatibility context is intentionally retained only for bootstrap transition.'

  skill-tools:
    name: skill-tools
    if: ${{ always() }}
    needs:
      - canonical-validation
    runs-on: ubuntu-latest
    steps:
      - name: Deprecated base-bound context
        run: echo 'This base-bound compatibility context is intentionally retained only for bootstrap transition.'

  publish-head-required-checks:
    name: publish head-bound required checks
    if: ${{ always() }}
    needs:
      - repository-contract-windows-powershell
      - canonical-validation
      - github-copilot-agent-skills
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Publish head-bound required checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          WINDOWS_RESULT: ${{ needs['repository-contract-windows-powershell'].result }}
          CANONICAL_RESULT: ${{ needs['canonical-validation'].result }}
          PUBLICATION_RESULT: ${{ needs['github-copilot-agent-skills'].result }}
        run: |
          set -euo pipefail
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'The required-check publisher did not receive one full candidate SHA.' >&2
            exit 1
          fi
           conclusion='failure'
           if [[ "$WINDOWS_RESULT" == 'success' && "$CANONICAL_RESULT" == 'success' && "$PUBLICATION_RESULT" == 'success' ]]; then
            conclusion='success'
          fi
          details_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for check_name in \
            'repository-contract' \
            'repository-contract (Windows PowerShell 5.1)' \
            'skill-validator' \
            'skill-tools' \
            'Darktide Translate Standard v1'; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" \
              -f name="$check_name" \
              -f head_sha="$HEAD_SHA" \
              -f status=completed \
              -f conclusion="$conclusion" \
              -f details_url="$details_url" >/dev/null
          done
