name: Validation Rebuild

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild-repository-contract:
    name: rebuild-repository-contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve Pester
        shell: pwsh
        run: |
          $module = Get-Module -Name Pester -ListAvailable |
            Where-Object { $_.Version.Major -ge 5 } |
            Sort-Object Version -Descending |
            Select-Object -First 1
          if ($null -eq $module) {
            Install-Module -Name Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck
            $module = Get-Module -Name Pester -ListAvailable |
              Where-Object { $_.Version.Major -ge 5 } |
              Sort-Object Version -Descending |
              Select-Object -First 1
          }
          Write-Host "Pester $($module.Version)"

      - name: Run rebuild-maintenance validation
        shell: pwsh
        run: ./scripts/Invoke-PrePushValidation.ps1

  rebuild-skill-validator:
    name: rebuild-skill-validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache: false

      - name: Validate the preserved Skill package
        shell: bash
        run: |
          go install github.com/agent-ecosystem/skill-validator/cmd/skill-validator@latest
          VALIDATOR="$(go env GOPATH)/bin/skill-validator"
          "$VALIDATOR" --version
          "$VALIDATOR" check --strict --allow-dirs=agents --emit-annotations .agents/skills/

  rebuild-skill-tools:
    name: rebuild-skill-tools
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'lts/*'
          check-latest: true

      - name: Validate the preserved Skill package with skill-tools
        shell: bash
        run: |
          npm install --global --no-audit --no-fund skill-tools@latest
          skill-tools --version
          skill-tools check .agents/skills/ \
            --format text \
            --fail-on warning \
            --min-score 91
